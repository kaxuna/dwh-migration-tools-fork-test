plugins {
    id 'dwh-migration-dumper.connector-conventions'
}

dependencies {
    implementation(libs.oozie.client) {
        exclude group: 'javax.jms', module: 'jms'
        exclude group: 'junit', module: 'junit'
        exclude group: 'guru.nidi', module: 'graphviz-java'

        //Not used and has LGPLv3 transient deps
        exclude group: 'org.apache.oozie', module: 'oozie-fluent-job-api'
    }

    //Overrides for oozie-client transient deps
    implementation libs.xerces // explicit version for vulnerabilities update

    implementation libs.jackson.databind

    testImplementation libs.wiremock
}
