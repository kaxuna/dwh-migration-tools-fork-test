import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    dependencies {
        classpath libs.gradle.license.report
    }
}

plugins {
    id 'dwh-migration-dumper.java-application-conventions'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '1.10.0'
}

apply plugin: 'com.github.jk1.dependency-license-report'
apply plugin: "jacoco"
apply plugin: 'com.adarshr.test-logger'

configurations {
    sources {
        transitive = true
    }

    configureEach {
        // *-over-slf4j bridges used
        exclude group: "ch.qos.reload4j", module: "reload4j"
        exclude group: "org.slf4j", module: "slf4j-reload4j"

        // We use logback-classic instead of simple
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

dependencies {
    compileOnly libs.auto.value.annotations

    annotationProcessor libs.auto.value

    implementation project(':dumper:connector-api')
    implementation project(':dumper:lib-common')
    implementation project(':dumper:lib-dumper-spi')

    implementation libs.guava
    implementation libs.jopt.simple
    implementation libs.jdiagnostics
    implementation libs.commons.io
    implementation libs.apache.avro
    implementation libs.apache.commons.csv
    implementation libs.apache.commons.lang3
    implementation(libs.harawata.appdirs) {
        exclude group: "net.java.dev.jna", module: "jna"
    }
    implementation libs.spring.core
    implementation libs.spring.jdbc
    implementation libs.hikaricp
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.jackson.datatype.guava
    implementation libs.jackson.datatype.jsr310
    implementation libs.google.cloud.nio
    implementation libs.google.cloud.kms
    implementation libs.httpclient5

    // `implementation` scope is used because some of our dependencies
    // have log libraries in this scope as transient dependencies
    implementation libs.logback.classic
    implementation libs.jcl.over.slf4j

    implementation libs.async.profiler

    testFixturesApi testFixtures(project(':dumper:lib-common'))
    testFixturesApi testFixtures(project(':dumper:connector-api'))
    testFixturesApi project(':dumper:connector-api')
    testFixturesImplementation libs.sqlite.jdbc
    testFixturesImplementation libs.apache.commons.compress
    testFixturesImplementation libs.jackson.databind

    testImplementation libs.sqlite.jdbc
    testImplementation libs.postgresql
    testImplementation libs.system.rules
    testImplementation libs.joda.time
    testImplementation libs.mockito.core
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.junit.jupiter
    testImplementation libs.junit
    testImplementation libs.wiremock

    sources "org.slf4j:jcl-over-slf4j:${libs.versions.jcl.over.slf4j.get()}:sources"
    sources "ch.qos.logback:logback-classic:${libs.versions.logback.get()}:sources"
}

dependencyLocking {
    lockAllConfigurations()
}

jacoco {
    toolVersion = "0.8.11"
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: '**/dumper/application/**/AutoValue_*')
        }))
    }
}

startScripts {
    applicationName = "dwh-migration-dumper-starter"
    classpath = files('$APP_HOME/lib/*')
}

tasks.named('installDist') {
    dependsOn 'cloudExtractorStartScripts'
    dependsOn 'cloudExtractorStartScriptsForJava8'
}

application {
    // Define the main class for the application.
    mainClass = 'com.google.edwmigration.dumper.application.dumper.Main'
    applicationName = 'dwh-migration-dumper'
}

task cloudExtractorStartScriptsForJava8(type: CreateStartScripts) {
    outputDir = layout.buildDirectory.dir('install/cloud-extractor/bin').get().asFile
    classpath = tasks.startScripts.classpath
    mainClass = 'com.google.edwmigration.dumper.application.dumper.clouddumper.Main'
    applicationName = 'dwh-cloud-extractor'
}

task cloudExtractorStartScripts(type: CreateStartScripts) {
    outputDir = tasks.cloudExtractorStartScriptsForJava8.outputDir
    classpath = tasks.cloudExtractorStartScriptsForJava8.classpath
    mainClass = tasks.cloudExtractorStartScriptsForJava8.mainClass
    applicationName = 'dwh-cloud-extractor-java8'
    defaultJvmOpts = ["--add-opens=java.base/java.nio=ALL-UNNAMED"]
    dependsOn 'cloudExtractorStartScriptsForJava8'
}

licenseReport {
    // onlyIf { ! gradle.startParameter.offline }
    filters = [
        new com.github.jk1.license.filter.LicenseBundleNormalizer(bundlePath: rootProject.file("gradle/licenses/license-bundle-normalizer.json"), createDefaultTransformationRules: true)
    ]
    renderers = [
        new com.google.edwmigration.dumper.build.licensereport.CsvReportRenderer(),
        new com.github.jk1.license.render.JsonReportRenderer('index.json', false),
        new com.github.jk1.license.render.InventoryHtmlReportRenderer("index.html", "Licenses of Third Party Dependencies")
    ]
    allowedLicensesFile = rootProject.file("gradle/licenses/license-allowed.json")
    // Cover the plugin directories too: their dependencies ship in the zip but are no longer
    // on the app's runtimeClasspath.
    configurations = ['runtimeClasspath'] + ['airflow', 'bigquery', 'cloudera', 'generic',
            'greenplum', 'hadoop', 'hdfs', 'hive', 'mysql', 'netezza', 'oracle', 'postgresql',
            'ranger', 'redshift', 'snowflake', 'sqlserver', 'teradata', 'vertica']
            .collect { "plugin${it.capitalize()}".toString() }
}

cyclonedxBom {
    includeConfigs = ["runtimeClasspath"] + ['airflow', 'bigquery', 'cloudera', 'generic',
            'greenplum', 'hadoop', 'hdfs', 'hive', 'mysql', 'netezza', 'oracle', 'postgresql',
            'ranger', 'redshift', 'snowflake', 'sqlserver', 'teradata', 'vertica']
            .collect { "plugin${it.capitalize()}".toString() }
    skipConfigs = ["compileClasspath", "testCompileClasspath"]
    projectType = "application"
    schemaVersion = "1.5"
    destination = file("build/reports/bom")
    outputFormat = "json"
    outputName = "bom"
}

tasks.named('check') {
    dependsOn 'checkLicense', 'printBanner'
}

tasks.named('distTar') {
    dependsOn 'installDist'
}

tasks.named('distZip') {
    dependsOn 'installDist'
}

tasks.register('generateSourceMirror', Copy) {
    dependsOn 'compileJava'
    from {
        def mirroredConfigurations = [configurations.runtimeClasspath] +
                configurations.findAll { it.name.startsWith('plugin') && it.canBeResolved }
        dependencies.createArtifactResolutionQuery()
                .forComponents(
                        mirroredConfigurations.collectMany {
                            it.incoming.resolutionResult
                                    .allDependencies
                                    .findAll { it instanceof ResolvedDependencyResult }
                                    .collect { it.selected.id }
                        }.unique()
                )
                .withArtifacts(JvmLibrary, SourcesArtifact)
                .execute()
                .resolvedComponents
                .collectMany {
                    it.artifactResults
                            .collect { it.file.path }
                }
    }
    into layout.buildDirectory.dir('mirror/sources')
    outputs.dir "mirror/sources"
}

tasks.register('copyGceLauncher', Copy) {
    from 'src/main/sh/cloud_extractor/gce_launcher.sh'
    into layout.buildDirectory.dir('cloud_extractor/launcher')
    filter(ReplaceTokens, tokens: [dumper_version: project.version])
    filteringCharset = 'UTF-8'
}

tasks.register("printBanner") {
    File bannerFile = file('src/main/resources/banner/banner.txt')
    if (bannerFile.exists()) {
        bannerFile.readLines().forEach {println it}
    } else {
        println "Warning: Banner file not found at ${bannerFile.path}"
    }
}

distributions {
    main {
        distributionBaseName = "app"
    }
    published {
        distributionBaseName = "dwh-migration-dumper"
        contents {
            from installDist
            from(cloudExtractorStartScripts) {
                into "bin"
            }
            from("src/main/sh/dwh-migration-dumper") {
                into "bin"
            }
            from("src/main/sh/dwh-migration-dumper.bat") {
                into "bin"
            }
            from(generateLicenseReport) {
                into "docs/licenses"
            }
            from(generateSourceMirror) {
                into "docs/sources"
            }
            from(cyclonedxBom) {
                into "docs/bom"
            }
        }
    }
}

def connectorNames = ['airflow', 'bigquery', 'cloudera', 'generic', 'greenplum', 'hadoop',
        'hdfs', 'hive', 'mysql', 'netezza', 'oracle', 'postgresql', 'ranger', 'redshift',
        'snowflake', 'sqlserver', 'teradata', 'vertica']

// group:name pairs already shipped in the core lib/ directory. Plugin directories carry only
// what the core does not: the connector jar itself plus vendor-specific dependencies. Matching
// ignores the version - plugin class loaders are parent-first, so the core's version would win
// anyway and a second copy would be dead weight.
def coreArtifactIds = provider {
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .collect { "${it.moduleVersion.id.group}:${it.name}".toString() } as Set
}

def assemblePluginTasks = connectorNames.collect { connectorName ->
    def pluginConfiguration = configurations.create("plugin${connectorName.capitalize()}") {
        canBeConsumed = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
    dependencies.add(pluginConfiguration.name, project(":dumper:connectors:${connectorName}"))
    tasks.register("assemblePlugin${connectorName.capitalize()}", Sync) {
        dependsOn pluginConfiguration
        into layout.buildDirectory.dir("plugins/${connectorName}")
        from(files(provider {
            def core = coreArtifactIds.get()
            pluginConfiguration.resolvedConfiguration.resolvedArtifacts
                    .findAll { !core.contains("${it.moduleVersion.id.group}:${it.name}".toString()) }
                    .collect { it.file }
        }))
    }
}

tasks.register('assemblePlugins') {
    dependsOn assemblePluginTasks
}

// Single-vendor distributions: the core CLI plus exactly one plugin directory, e.g.
// `./gradlew :dumper:app:snowflakeDistZip` -> build/distributions/dwh-migration-dumper-snowflake.zip
connectorNames.each { connectorName ->
    tasks.register("${connectorName}DistZip", Zip) {
        group = 'distribution'
        description = "Builds a distribution zip containing only the ${connectorName} connector plugin."
        dependsOn 'installDist', "assemblePlugin${connectorName.capitalize()}"
        archiveBaseName = "dwh-migration-dumper-${connectorName}"
        destinationDirectory = layout.buildDirectory.dir('distributions')
        into("dwh-migration-dumper-${connectorName}") {
            from(layout.buildDirectory.dir('install/app'))
            from('src/main/sh/dwh-migration-dumper') { into 'bin' }
            from('src/main/sh/dwh-migration-dumper.bat') { into 'bin' }
            into("plugins/${connectorName}") {
                from(layout.buildDirectory.dir("plugins/${connectorName}"))
            }
        }
    }
}

distributions.published.contents {
    into('plugins') {
        from(layout.buildDirectory.dir('plugins'))
    }
}

['publishedDistZip', 'publishedDistTar', 'installPublishedDist'].collect(tasks::named).each {
    it.configure { dependsOn('assemblePlugins') }
}

['publishedDistZip', 'publishedDistTar', 'installPublishedDist'].collect(tasks::named).each {
    it.configure { dependsOn('checkLicense') }
}
