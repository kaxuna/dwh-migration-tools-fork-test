// Conventions for connector plugin modules (dumper/connectors/*). Each module holds one vendor's
// connectors and is packaged as a runtime plugin: its jar plus its vendor-specific dependencies
// land in plugins/<vendor>/ of the distribution, loaded by PluginLoader through an isolated
// class loader. Dependencies shared with the core (connector-api and below) stay in the core's
// lib/ directory and must be declared here as api/implementation as usual - packaging strips
// anything the core already ships.
plugins {
    id 'dwh-migration-dumper.java-library-conventions'
}

// Same group as the sibling dumper modules (the default would be
// dwh-migration-tools.dumper.connectors because of the extra directory level). The license
// check excludes only the build's own group from the third-party report.
group = 'dwh-migration-tools.dumper'

dependencies {
    api project(':dumper:connector-api')

    testImplementation testFixtures(project(':dumper:connector-api'))
    testImplementation testFixtures(project(':dumper:app'))
    testImplementation libs.mockito.core
    testImplementation libs.mockito.inline
}

dependencyLocking {
    lockAllConfigurations()
}
